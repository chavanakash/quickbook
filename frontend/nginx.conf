# nginx = static file server + API gateway.
# Service names below are Docker Compose service names; we will reuse the same
# names for Kubernetes Services so this file works unchanged in both places.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 30s;

    location /api/auth/      { proxy_pass http://auth-service:8000; }
    location /api/inventory/ { proxy_pass http://inventory-service:8000; }
    location = /api/bookings { proxy_pass http://booking-service:8000; }
    location /api/bookings/  { proxy_pass http://booking-service:8000; }
    location /api/payments   { proxy_pass http://payment-service:8000; }
    location /api/tickets/   { proxy_pass http://ticket-service:8000; }

    # Service-to-service endpoints must never be reachable from the internet.
    location /internal/ { return 404; }

    location = /nginx-health {
        access_log off;
        return 200 'ok';
    }

    # Single-page app: unknown paths fall back to index.html so React Router handles them.
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
