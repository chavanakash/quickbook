# Drill 12 - Init:0/1 forever: the init container waits for a Service that doesn't exist.
apiVersion: v1
kind: Pod
metadata: {name: waits-forever, namespace: drills, labels: {drill: "12"}}
spec:
  initContainers:
    - name: wait-for-db
      image: busybox:1.36
      command: ["sh", "-c", "until nslookup orders-db.drills.svc.cluster.local; do echo 'waiting for orders-db'; sleep 3; done"]
  containers:
    - name: app
      image: nginx:1.27-alpine
      resources: {requests: {cpu: 10m, memory: 16Mi}}
