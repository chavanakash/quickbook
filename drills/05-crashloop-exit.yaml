# Drill 5 - CrashLoopBackOff: the process exits with an error a few seconds after starting.
apiVersion: v1
kind: Pod
metadata: {name: crasher, namespace: drills, labels: {drill: "5"}}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'starting app'; sleep 3; echo 'FATAL: config file /etc/app/app.conf not found' >&2; exit 1"]
      resources: {requests: {cpu: 10m, memory: 16Mi}}
