# Entry point: kubectl apply -k k8s/
# Jenkins changes image tags here with: kustomize edit set image dockerizzz/quickbook-auth-service=...:<tag>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: quickbook
labels:
  - pairs:
      app.kubernetes.io/part-of: quickbook
resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - postgres/init-secret.yaml
  - postgres/statefulset.yaml
  - services/auth-service.yaml
  - services/auth-service-hpa.yaml
  - services/inventory-service.yaml
  - services/booking-service.yaml
  - services/payment-service.yaml
  - services/ticket-service.yaml
  - services/frontend.yaml
  - ingress.yaml
images:
  - name: dockerizzz/quickbook-auth-service
    newTag: v1.0.0
  - name: dockerizzz/quickbook-inventory-service
    newTag: v1.0.0
  - name: dockerizzz/quickbook-booking-service
    newTag: v1.0.0
  - name: dockerizzz/quickbook-payment-service
    newTag: v1.0.0
  - name: dockerizzz/quickbook-ticket-service
    newTag: v1.0.0
  - name: dockerizzz/quickbook-frontend
    newTag: v1.0.0
