# auth-service: sign up / sign in, issues JWTs
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
    part-of: quickbook
spec:
  # No replicas field: the HorizontalPodAutoscaler (auth-service-hpa.yaml) owns the pod count.
  revisionHistoryLimit: 5 # keep old ReplicaSets so "kubectl rollout undo" works
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below the desired count during a deploy
      maxSurge: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        part-of: quickbook
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: auth-service
      # Runs before the app and blocks until Postgres accepts connections, so the app
      # never starts (and crash-loops) against a database that is still initialising.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -t 2; do echo waiting for postgres; sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsUser: 70 # the image's "postgres" user; pod policy requires non-root
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: auth-service
          image: dockerizzz/quickbook-auth-service # tag is set in kustomization.yaml
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: quickbook-config
                  key: LOG_LEVEL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: quickbook-secrets
                  key: AUTH_DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: quickbook-secrets
                  key: JWT_SECRET
            # Overload protection, sized with the capacity model (capacity-model/README.md):
            # 8 concurrent bcrypt handlers + 10 waiting per pod; beyond that, an immediate 503.
            - name: THREADPOOL_SIZE
              value: "8"
            - name: MAX_IN_FLIGHT
              value: "18"
            - name: BCRYPT_ROUNDS
              value: "12"
          resources:
            # 1 core per pod (was 0.5): bcrypt is CPU-bound; the 0.5-core limit doubled every login's latency.
            # The request is what the HPA measures utilisation against.
            requests:
              cpu: 400m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          # startupProbe gives the app up to 60s (e.g. waiting for Postgres) before liveness kicks in.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # Tolerant liveness: a busy pod is not a broken pod. (The stress test showed the default
          # 1 s / 3 failures killing healthy-but-busy pods and turning overload into an outage.)
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8000
      targetPort: http
