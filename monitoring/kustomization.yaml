# QuickBook monitoring add-ons (needs kube-prometheus-stack installed first - see README.md).
# Apply: kubectl apply -k monitoring/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - servicemonitor.yaml
  - alerts.yaml
  - ingress.yaml
configMapGenerator:
  # Grafana's sidecar loads any ConfigMap labelled grafana_dashboard=1 as a dashboard.
  - name: quickbook-dashboards
    files:
      - dashboards/quickbook-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
